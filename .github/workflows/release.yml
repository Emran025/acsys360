name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: linux
          - platform: windows
            os: windows-latest
            target: windows
          - platform: macos
            os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: >-
          dart format --output=none --set-exit-if-changed
          lib test
          packages/compiler_contracts/lib packages/compiler_contracts/test
      - run: flutter analyze
      - run: flutter test

      - if: matrix.target == 'linux'
        name: Install Linux build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev flex bison nasm gcc dpkg-dev rpm
      - if: matrix.target == 'windows'
        name: Install Flex & Bison
        shell: pwsh
        run: choco install winflexbison3 innosetup --yes --no-progress
      - if: matrix.target == 'windows'
        name: Install bundled Windows toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
      - if: matrix.target == 'macos'
        name: Install macOS build tools
        run: |
          brew install flex bison
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter build ${{ matrix.target }} --release

      - name: Build C compiler (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          cd packages/compiler_c
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Build C compiler (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cd packages/compiler_c
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --config Release

      - name: Bundle compiler and native tools (Linux)
        if: matrix.target == 'linux'
        shell: bash
        run: |
          bundle=build/linux/x64/release/bundle
          mkdir -p "$bundle/compiler"
          cp packages/compiler_c/build/arabicc "$bundle/compiler/arabicc"
          chmod +x "$bundle/compiler/arabicc"
      - name: Bundle compiler and native tools (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force "$release/compiler", "$release/toolchain/windows/bin" | Out-Null
          $exe = if (Test-Path packages/compiler_c/build/Release/arabicc.exe) { "packages/compiler_c/build/Release/arabicc.exe" } else { "packages/compiler_c/build/arabicc.exe" }
          Copy-Item $exe "$release/compiler/arabicc.exe"
          Copy-Item C:/msys64/ucrt64/bin/* "$release/toolchain/windows/bin/" -Recurse -Force
          foreach ($directory in @("include", "lib", "libexec", "share")) {
            $source = "C:/msys64/ucrt64/$directory"
            if (Test-Path $source) { Copy-Item $source "$release/toolchain/windows/" -Recurse -Force }
          }
      - name: Bundle compiler and native tools (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: |
          app=build/macos/Build/Products/Release/acsys360.app
          dest="$app/Contents/MacOS"
          mkdir -p "$dest/compiler"
          cp packages/compiler_c/build/arabicc "$dest/compiler/arabicc"
          chmod +x "$dest/compiler/arabicc"

      - name: Smoke test bundled compiler (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = linux ]; then path=build/linux/x64/release/bundle/compiler/arabicc; else path=build/macos/Build/Products/Release/acsys360.app/Contents/MacOS/compiler/arabicc; fi
          dart run tool/verify_compiler_bundle.dart --executable "$path"
      - name: Smoke test bundled compiler (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: dart run tool/verify_compiler_bundle.dart --executable build/windows/x64/runner/Release/compiler/arabicc.exe

      - name: Build Linux DEB and RPM installers
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then version="$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)"; fi
          root="$RUNNER_TEMP/acsys360-package"
          mkdir -p "$root/DEBIAN" "$root/opt/acsys360" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/512x512/apps"
          cp -a build/linux/x64/release/bundle/. "$root/opt/acsys360/"
          install -m 0644 linux/runner/resources/acsys360.desktop "$root/usr/share/applications/acsys360.desktop"
          install -m 0644 linux/runner/resources/arabic360.png "$root/usr/share/icons/hicolor/512x512/apps/acsys360.png"
          sed -i 's|^Exec=.*|Exec=/opt/acsys360/acsys360|; s|^Icon=.*|Icon=acsys360|' "$root/usr/share/applications/acsys360.desktop"
          cat > "$root/DEBIAN/control" <<EOF
          Package: acsys360
          Version: ${version}
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: acsys360 maintainers
          Depends: libgtk-3-0, liblzma5, gcc, nasm
          Description: Arabic-first desktop programming environment
           Includes the acsys360 desktop application and Arabic compiler.
          EOF
          mkdir -p dist
          dpkg-deb --build --root-owner-group "$root" "dist/acsys360-linux-${version}-amd64.deb"
          mkdir -p "$RUNNER_TEMP/rpmbuild"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          rpmbuild -bb --define "_topdir $RUNNER_TEMP/rpmbuild" --define "_buildrootdir $root" --define "app_version $version" tool/packaging/acsys360.spec
          find "$RUNNER_TEMP/rpmbuild/RPMS" -type f -name '*.rpm' -exec cp {} dist/ \;
      - name: Build Windows setup installer
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { (Select-String '^version: ([0-9.]+)' pubspec.yaml).Matches.Groups[1].Value }
          $sourceDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $outputDir = (New-Item -ItemType Directory -Force dist).FullName
          & "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" tool/packaging/acsys360-windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $outputDir "acsys360-windows-$version-setup-x64.exe"))) { throw "Windows setup installer was not created in $outputDir" }
      - name: Build macOS package installer
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then version="$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)"; fi
          mkdir -p dist
          pkgbuild --root build/macos/Build/Products/Release --install-location /Applications --identifier com.acsys360.desktop --version "$version" "dist/acsys360-macos-${version}.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: acsys360-${{ matrix.platform }}-installer
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
