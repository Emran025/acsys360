name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            target: linux
          - platform: windows
            os: windows-latest
            target: windows
          - platform: macos
            os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: >-
          dart format --output=none --set-exit-if-changed
          lib test
          packages/compiler_contracts/lib packages/compiler_contracts/test
      - run: flutter analyze
      - run: flutter test

      # ── Linux desktop build ──────────────────────────────────────────────
      - if: matrix.target == 'linux'
        name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev flex bison
      - if: matrix.target != 'linux'
        name: Install Flutter desktop prerequisites (non-Linux)
        shell: bash
        run: echo "No extra prerequisites needed for ${{ matrix.target }}"

      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter build ${{ matrix.target }} --release

      # ── Build C compiler (Unix) ──────────────────────────────────────────
      - name: Build C compiler (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          cd packages/compiler_c
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # ── Build C compiler (Windows) ───────────────────────────────────────
      - name: Install Flex & Bison (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: choco install winflexbison3 --yes --no-progress

      - name: Build C compiler (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          cd packages/compiler_c
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --config Release

      # ── Bundle compiler into app (Linux) ────────────────────────────────
      - name: Bundle compiler on Linux
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p build/linux/x64/release/bundle/compiler
          cp packages/compiler_c/build/arabicc build/linux/x64/release/bundle/compiler/arabicc
          chmod +x build/linux/x64/release/bundle/compiler/arabicc

      # ── Bundle compiler into app (Windows) ──────────────────────────────
      - name: Bundle compiler on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows/x64/runner/Release/compiler | Out-Null
          $exe = if (Test-Path packages/compiler_c/build/Release/arabicc.exe) {
            "packages/compiler_c/build/Release/arabicc.exe"
          } else {
            "packages/compiler_c/build/arabicc.exe"
          }
          Copy-Item $exe build/windows/x64/runner/Release/compiler/arabicc.exe

      # ── Bundle compiler into app (macOS) ────────────────────────────────
      - name: Install Flex & Bison (macOS)
        if: matrix.target == 'macos'
        shell: bash
        run: brew install flex bison

      - name: Bundle compiler on macOS
        if: matrix.target == 'macos'
        shell: bash
        run: |
          dest="build/macos/Build/Products/Release/acsys360.app/Contents/MacOS/compiler"
          mkdir -p "$dest"
          cp packages/compiler_c/build/arabicc "$dest/arabicc"
          chmod +x "$dest/arabicc"

      # ── Smoke test bundled compiler ──────────────────────────────────────
      - name: Smoke test bundled compiler (Unix)
        if: matrix.target != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "linux" ]; then
            compiler_path="build/linux/x64/release/bundle/compiler/arabicc"
          else
            compiler_path="build/macos/Build/Products/Release/acsys360.app/Contents/MacOS/compiler/arabicc"
          fi
          dart run tool/verify_compiler_bundle.dart --executable "$compiler_path"

      - name: Smoke test bundled compiler (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: dart run tool/verify_compiler_bundle.dart --executable build/windows/x64/runner/Release/compiler/arabicc.exe

      # ── Package artifacts ────────────────────────────────────────────────
      - name: Package Linux
        if: matrix.target == 'linux'
        run: tar -czf acsys360-linux-${{ github.ref_name }}.tar.gz -C build/linux/x64/release bundle
      - name: Package Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath acsys360-windows-${{ github.ref_name }}.zip
      - name: Package macOS
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/acsys360.app acsys360-macos-${{ github.ref_name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: acsys360-${{ matrix.platform }}
          path: |
            *.tar.gz
            *.zip

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*