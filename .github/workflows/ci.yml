name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Get compiler core dependencies
        working-directory: packages/compiler_core
        run: dart pub get
      - name: Analyze compiler core
        working-directory: packages/compiler_core
        run: dart analyze
      - name: Run compiler self-tests
        working-directory: packages/compiler_core
        run: dart run bin/self_test.dart
      - name: Get shared contracts dependencies
        working-directory: packages/compiler_contracts
        run: dart pub get
      - name: Analyze shared contracts
        working-directory: packages/compiler_contracts
        run: dart analyze
      - name: Test shared contracts
        working-directory: packages/compiler_contracts
        run: dart test

  compiler-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build C compiler milestone
        working-directory: packages/compiler_c
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Test C compiler milestone
        working-directory: packages/compiler_c
        run: ctest --test-dir build --output-on-failure

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: >-
          dart format --output=none --set-exit-if-changed
          lib test
          packages/compiler_core/lib packages/compiler_core/test
          packages/compiler_contracts/lib packages/compiler_contracts/test
      - run: flutter analyze
      - run: flutter test

  desktop-build:
    needs: [compiler-core, compiler-c, editor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          cache: true
      - run: flutter config --enable-linux-desktop
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: acsys360-linux
          path: build/linux/x64/release/bundle
