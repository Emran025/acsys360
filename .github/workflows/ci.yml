name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned development image
        run: docker build --file .devcontainer/Dockerfile --tag acsys360-dev .
      - name: Format, analyze, and test inside the development image
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace/acsys360"
          --workdir /workspace/acsys360
          acsys360-dev
          bash -lc "flutter pub get && dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test"

  desktop-build:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the pinned development image
        run: docker build --file .devcontainer/Dockerfile --tag acsys360-dev .
      - name: Build Linux desktop inside the development image
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/workspace/acsys360"
          --workdir /workspace/acsys360
          acsys360-dev
          bash -lc "flutter pub get && flutter build linux --release"
      - uses: actions/upload-artifact@v4
        with:
          name: acsys360-linux
          path: build/linux/x64/release/bundle
